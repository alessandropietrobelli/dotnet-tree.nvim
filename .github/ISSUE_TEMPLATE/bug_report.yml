name: Bug report
description: Something renders wrong, errors out, or does not appear
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Two things make a report reproducible, and without them the thread turns
        into five rounds of questions:

        1. the output of `:checkhealth dotnet-tree`, and
        2. the exact XML that renders wrong.

        Before filing: if the `dotnet-tree` source does not appear at all, run
        `:checkhealth dotnet-tree`. It is almost always `"dotnet-tree"` missing
        from neo-tree's `opts.sources`.

  - type: textarea
    id: checkhealth
    attributes:
      label: ":checkhealth dotnet-tree output"
      description: Paste the full output, including the lines that pass.
      render: text
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: xml
    attributes:
      label: The XML that renders wrong
      description: |
        The smallest fragment that reproduces it, sanitised — from the `.sln`,
        `.slnx`, `.csproj` or `Directory.Packages.props`, whichever holds the
        thing that is missing or wrong.

        Paste it **verbatim**. The parsers match on text rather than reading XML
        properly, so attribute order, quoting style, self-closing tags,
        whitespace, comments and slash direction all change the outcome —
        retyping or reformatting the fragment usually hides the bug.

        Rename anything private; keep the structure. If the bug is not about how
        something renders, write `N/A`.
      render: xml
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Neovim at the root of a solution with ...
        2. :Neotree dotnet-tree reveal
        3. ...
    validations:
      required: true

  - type: input
    id: nvim
    attributes:
      label: Neovim version
      placeholder: "nvim --version | head -1"
    validations:
      required: true

  - type: input
    id: neotree
    attributes:
      label: neo-tree.nvim version
      placeholder: commit sha or tag
    validations:
      required: true

  - type: input
    id: plugin
    attributes:
      label: dotnet-tree.nvim version
      placeholder: tag, or commit sha if you track main
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Solution format
      options:
        - .sln
        - .slnx
        - both / not sure
    validations:
      required: true

  - type: checkboxes
    id: cpm
    attributes:
      label: Central Package Management
      options:
        - label: The repository has a `Directory.Packages.props`

  - type: input
    id: dotnet
    attributes:
      label: dotnet SDK version
      description: "`dotnet --version`. Leave empty if the CLI is not installed."

  - type: textarea
    id: solution
    attributes:
      label: Whole solution file (optional)
      description: >-
        If the fragment above does not reproduce it on its own, a sanitised
        complete `.sln`/`.slnx` helps.
      render: xml

  - type: checkboxes
    id: known
    attributes:
      label: Already documented
      description: >-
        Two parsing limits are known, and pinned down in the test suite.
      options:
        - label: >-
            I checked the known limitations in
            [CHANGELOG.md](https://github.com/alessandropietrobelli/dotnet-tree.nvim/blob/main/CHANGELOG.md)
            — a `<Version>` child element instead of an attribute, and an
            unescaped `>` inside an attribute value — and this is not one of them.
