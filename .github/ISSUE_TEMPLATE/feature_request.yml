name: Feature request
description: Suggest something the solution explorer should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the workflow, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today

  - type: markdown
    attributes:
      value: |
        Note on scope: this plugin renders the .NET solution graph and acts on
        nodes via the `dotnet` CLI. Debugging belongs in `nvim-dap`, test UIs in
        `neotest`, and LSP setup in your own config.
